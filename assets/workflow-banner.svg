<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">Purpose-Driven Introduction 工作流程</title>
  <desc id="desc">从多篇论文出发，依次完成证据提取、思路分布、科学问题、研究建议和 Introduction 组织。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11151d"/>
      <stop offset="0.52" stop-color="#151c2a"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d8dff"/>
      <stop offset="0.5" stop-color="#9d72ef"/>
      <stop offset="1" stop-color="#42c7a5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1400" height="430" rx="26" fill="url(#bg)"/>
  <rect width="1400" height="430" rx="26" fill="url(#grid)"/>
  <circle cx="1280" cy="38" r="180" fill="#4263eb" opacity="0.06"/>
  <circle cx="80" cy="420" r="190" fill="#9d72ef" opacity="0.05"/>

  <text x="700" y="52" text-anchor="middle" fill="#8e9aad" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="3">MULTI-PAPER SYNTHESIS PIPELINE</text>
  <text x="700" y="91" text-anchor="middle" fill="#f3f6fb" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700">从论文证据到研究问题与写作主线</text>

  <line x1="154" y1="216" x2="1246" y2="216" stroke="url(#line)" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <path d="M1236 207 L1252 216 L1236 225" fill="none" stroke="#42c7a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <g transform="translate(50 132)">
      <rect width="220" height="184" rx="18" fill="#1b2535" stroke="#4d8dff" stroke-opacity="0.65"/>
      <circle cx="110" cy="48" r="25" fill="#4d8dff"/>
      <text x="110" y="57" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">01</text>
      <text x="110" y="105" text-anchor="middle" fill="#f4f7fb" font-size="23" font-weight="700">证据提取</text>
      <text x="110" y="139" text-anchor="middle" fill="#9fb0c7" font-size="16">去重 · 处理链 · 来源位置</text>
      <text x="110" y="169" text-anchor="middle" fill="#6f829c" font-size="13" letter-spacing="1">EVIDENCE</text>
    </g>
    <g transform="translate(310 132)">
      <rect width="220" height="184" rx="18" fill="#1c2437" stroke="#737fec" stroke-opacity="0.7"/>
      <circle cx="110" cy="48" r="25" fill="#737fec"/>
      <text x="110" y="57" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">02</text>
      <text x="110" y="105" text-anchor="middle" fill="#f4f7fb" font-size="23" font-weight="700">思路分布</text>
      <text x="110" y="139" text-anchor="middle" fill="#9fb0c7" font-size="16">证据矩阵 · 覆盖率 · 分布图</text>
      <text x="110" y="169" text-anchor="middle" fill="#6f829c" font-size="13" letter-spacing="1">DISTRIBUTION</text>
    </g>
    <g transform="translate(570 132)">
      <rect width="220" height="184" rx="18" fill="#242239" stroke="#9d72ef" stroke-opacity="0.75"/>
      <circle cx="110" cy="48" r="25" fill="#9d72ef"/>
      <text x="110" y="57" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">03</text>
      <text x="110" y="105" text-anchor="middle" fill="#f4f7fb" font-size="23" font-weight="700">科学问题</text>
      <text x="110" y="139" text-anchor="middle" fill="#aab0c7" font-size="16">已有答案 · 剩余问题 · 联系</text>
      <text x="110" y="169" text-anchor="middle" fill="#7f789c" font-size="13" letter-spacing="1">QUESTIONS</text>
    </g>
    <g transform="translate(830 132)">
      <rect width="220" height="184" rx="18" fill="#202737" stroke="#d39a55" stroke-opacity="0.72"/>
      <circle cx="110" cy="48" r="25" fill="#d39a55"/>
      <text x="110" y="57" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">04</text>
      <text x="110" y="105" text-anchor="middle" fill="#f4f7fb" font-size="23" font-weight="700">研究建议</text>
      <text x="110" y="139" text-anchor="middle" fill="#aab0c7" font-size="16">新增考虑 · 验证 · 边界</text>
      <text x="110" y="169" text-anchor="middle" fill="#8d816f" font-size="13" letter-spacing="1">DIRECTIONS</text>
    </g>
    <g transform="translate(1090 132)">
      <rect width="260" height="184" rx="18" fill="#192d30" stroke="#42c7a5" stroke-opacity="0.78"/>
      <circle cx="130" cy="48" r="25" fill="#42c7a5"/>
      <text x="130" y="57" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">05</text>
      <text x="130" y="105" text-anchor="middle" fill="#f4f7fb" font-size="23" font-weight="700">Introduction</text>
      <text x="130" y="139" text-anchor="middle" fill="#a2bbb9" font-size="16">论证主线 · 逐段结构 · 过渡</text>
      <text x="130" y="169" text-anchor="middle" fill="#6f9690" font-size="13" letter-spacing="1">ON DEMAND</text>
    </g>
  </g>

  <g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="16">
    <rect x="50" y="354" width="328" height="42" rx="21" fill="#4d8dff" opacity="0.12"/>
    <text x="214" y="381" text-anchor="middle" fill="#9fc2ff">同一证据矩阵驱动图、表与正文</text>
    <rect x="536" y="354" width="328" height="42" rx="21" fill="#9d72ef" opacity="0.12"/>
    <text x="700" y="381" text-anchor="middle" fill="#c8b0f4">覆盖率描述样本，不等于创新概率</text>
    <rect x="1022" y="354" width="328" height="42" rx="21" fill="#42c7a5" opacity="0.12"/>
    <text x="1186" y="381" text-anchor="middle" fill="#9bdfcf">已有答案 → 剩余问题 → 新增考虑</text>
  </g>
</svg>
